# xrayclient-reversepanel 的 compose 模板
#
#   docker compose up -d
#   docker compose logs          # 首次启动会打印管理网页的初始账号密码
#   docker compose exec xrayclient-reversepanel /app/xrayclient-reversepanel info
#
# 配置、证书都在 ./data 目录，备份这个目录即可。
services:
  xrayclient-reversepanel:
    image: ghcr.io/tcpqueue/xrayclient-reversepanel:latest
    container_name: xrayclient-reversepanel
    restart: unless-stopped
    # 推荐 host 网络：容器里的 127.0.0.1 就是宿主机，能直接把宿主机上的服务（如 127.0.0.1:22）反代出去；
    # 管理网页直接监听宿主机的 7400 端口（可在网页“系统”页修改）。
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    # 可选：限制内存（程序本身一般 15~30MB）
    # mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  # 不想用 host 网络时（例如只反代其他容器或局域网里的机器），改用下面这种写法：
  #   - 去掉上面的 network_mode: host
  #   - 加上端口映射；本地服务要写宿主机/其他容器的 IP，不能写 127.0.0.1
  # xrayclient-reversepanel:
  #   image: ghcr.io/tcpqueue/xrayclient-reversepanel:latest
  #   restart: unless-stopped
  #   ports:
  #     - "7400:7400"
  #   volumes:
  #     - ./data:/app/data
